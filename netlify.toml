[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


[[redirects]]
  from = "/api/printful/products"
  to = "/.netlify/functions/printful-products"
  status = 200
  force = true
